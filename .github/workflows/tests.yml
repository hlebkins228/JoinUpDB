name: JoinUp tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      report_ready: ${{ steps.report.outputs.ready }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: app/test-report/ci/history
          key: allure-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-${{ github.ref_name }}-
      - name: Unit → integration → e2e in Docker
        env:
          TEST_REPORT_DIR: ${{ github.workspace }}/app/test-report/ci
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p test-report/ci
          bash tests/ci.sh 2>&1 | tee test-report/ci/ci.log
      - name: Ensure standalone report even after failure
        id: report
        if: always()
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -f test-report/ci/report.html ]]; then
            mkdir -p test-report/ci
            echo failed > test-report/ci/unit.status
            cp test-report/ci/ci.log test-report/ci/unit.log || true
            node tests/report.mjs test-report/ci
            if [[ -d test-report/ci/history ]]; then
              cp -a test-report/ci/history test-report/ci/allure-results/history
            fi
            npm install --prefix .test-tools --no-package-lock --no-audit --no-fund allure-commandline@2.46.1
            .test-tools/node_modules/.bin/allure generate test-report/ci/allure-results --clean -o test-report/ci/html
            cp -a test-report/ci/html/history test-report/ci/history-next
            rm -rf test-report/ci/history
            mv test-report/ci/history-next test-report/ci/history
            .test-tools/node_modules/.bin/allure generate test-report/ci/allure-results --single-file --clean -o test-report/ci/single
            cp test-report/ci/single/index.html test-report/ci/report.html
          fi
          mkdir -p test-report/ci/site
          cp test-report/ci/report.html test-report/ci/site/index.html
          cp test-report/ci/report.html test-report/ci/site/report.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Downloadable report.html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: app/test-report/ci/report.html
          if-no-files-found: error
      - name: Logs and captured traffic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_number }}
          path: |
            app/test-report/ci/*.log
            app/test-report/ci/*.pcap
            app/test-report/ci/*.status
            app/test-report/ci/*.out
            app/test-report/ci/allure-results
      - name: Save Allure history
        if: always() && hashFiles('app/test-report/ci/history/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: app/test-report/ci/history
          key: allure-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages report
        if: always() && steps.report.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/test-report/ci/site

  pages:
    needs: tests
    if: always() && needs.tests.outputs.report_ready == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: joinup-test-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy standalone test report
        id: deployment
        uses: actions/deploy-pages@v4
